[package]
name = "fast-pack"
version = "1.3.24"
authors = ["ColdEternity Team", "Long_Cold", "Wind_"]
description = "Fast Pack: automatic Minecraft Java resource pack version conversion"
license = "GPL-3.0-only"
repository = "https://github.com/LongCold-ColdEternity-Team/Fast-Pack"
readme = "README.md"
edition = "2024"
default-run = "FastPack"

[features]
default = ["compact-data", "gpu-renderer"]
compact-data = []
gpu-renderer = ["iced/wgpu"]

[lib]
name = "fast_pack"

[[bin]]
name = "FastPack"
path = "src/main.rs"

[[bin]]
name = "fast-pack-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "=0.10.9"
tempfile = "3.27"
walkdir = "2.5"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
zip = { version = "6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "advanced", "canvas", "tokio", "image-without-codecs"] }
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[build-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

[target.'cfg(windows)'.dev-dependencies]
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.fast-pack]
opt-level = 3

